plugins {
    id 'com.android.application'
}

android {
    namespace 'com.giwifi.autologin'
    compileSdk 35

    defaultConfig {
        applicationId "com.giwifi.autologin"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
