name: Build checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Android release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

  windows:
    name: Windows portable package
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows/requirements-build.txt

      - name: Cache PyInstaller build cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pyinstaller
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('windows/requirements-build.txt') }}
          restore-keys: |
            ${{ runner.os }}-pyinstaller-

      - name: Install build dependency
        run: python -m pip install -r windows/requirements-build.txt

      - name: Build Windows executable
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --windowed
          --name GiWiFi_AutoLogin
          --distpath build/windows-dist
          --workpath build/windows-work
          --specpath build/windows-spec
          windows/giwifi_gui.py

      - name: Smoke-check executable output
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/windows-dist/GiWiFi_AutoLogin.exe')) {
            throw 'PyInstaller did not produce GiWiFi_AutoLogin.exe'
          }
