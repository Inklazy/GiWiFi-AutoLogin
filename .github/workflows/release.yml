name: Build and publish release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  android:
    name: Android release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify tag matches Android version
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${VERSION#v}"
          app_version="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          test -n "$app_version"
          if [ "$tag_version" != "$app_version" ]; then
            echo "Tag version $tag_version does not match Android versionName $app_version" >&2
            exit 1
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Stage Android artifact
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -iname '*.apk' | head -n 1)"
          test -n "$apk"
          mkdir -p ../dist
          cp "$apk" "../dist/GiWiFi-AutoLogin-Android-${version}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiWiFi-AutoLogin-Android-${{ github.ref_name }}
          path: dist/GiWiFi-AutoLogin-Android-*.apk
          if-no-files-found: error

  windows:
    name: Windows portable package
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows/requirements-build.txt

      - name: Cache PyInstaller build cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pyinstaller
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('windows/requirements-build.txt') }}
          restore-keys: |
            ${{ runner.os }}-pyinstaller-

      - name: Install build dependency
        run: python -m pip install -r windows/requirements-build.txt

      - name: Build Windows executable
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --windowed
          --name GiWiFi_AutoLogin
          --distpath build/windows-dist
          --workpath build/windows-work
          --specpath build/windows-spec
          windows/giwifi_gui.py

      - name: Package Windows artifact
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION -replace '^v', ''
          $staging = Join-Path $env:RUNNER_TEMP 'GiWiFi-AutoLogin-Windows'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $staging, $dist | Out-Null
          Copy-Item 'build/windows-dist/GiWiFi_AutoLogin.exe' $staging
          Copy-Item 'windows/使用说明.txt' $staging
          $files = @((Join-Path $staging 'GiWiFi_AutoLogin.exe'), (Join-Path $staging '使用说明.txt'))
          $archive = Join-Path $dist "GiWiFi-AutoLogin-Windows-x64-$version.zip"
          Compress-Archive -LiteralPath $files -DestinationPath $archive -Force
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            if ($names.Count -ne 2 -or @(Compare-Object $names @('GiWiFi_AutoLogin.exe', '使用说明.txt')).Count -ne 0) {
              throw 'Windows ZIP must contain only GiWiFi_AutoLogin.exe and 使用说明.txt'
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiWiFi-AutoLogin-Windows-${{ github.ref_name }}
          path: dist/GiWiFi-AutoLogin-Windows-x64-*.zip
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [android, windows]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: GiWiFi-AutoLogin-Android-${{ github.ref_name }}
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: GiWiFi-AutoLogin-Windows-${{ github.ref_name }}
          path: dist

      - name: Verify release files
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          test -s "dist/GiWiFi-AutoLogin-Android-${version}.apk"
          test -s "dist/GiWiFi-AutoLogin-Windows-x64-${version}.zip"
          python - <<'PY'
          import glob, zipfile
          with zipfile.ZipFile(glob.glob('dist/*.zip')[0]) as archive:
              assert sorted(archive.namelist()) == sorted(['GiWiFi_AutoLogin.exe', '使用说明.txt']), 'Unexpected Windows ZIP contents'
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes_file=".github/release-notes/${version}.md"
          if gh release view "$TAG" --json isDraft > release-state.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to overwrite an already published release"'
          elif [ -f "$notes_file" ]; then
            gh release create "$TAG" --draft --verify-tag --title "GiWiFi-AutoLogin ${TAG}" --notes-file "$notes_file"
          else
            gh release create "$TAG" --draft --verify-tag --title "GiWiFi-AutoLogin ${TAG}" --generate-notes
          fi
          gh release upload "$TAG" "dist/GiWiFi-AutoLogin-Android-${version}.apk" "dist/GiWiFi-AutoLogin-Windows-x64-${version}.zip" --clobber
          gh release edit "$TAG" --draft=false --latest --title "GiWiFi-AutoLogin ${TAG}"
