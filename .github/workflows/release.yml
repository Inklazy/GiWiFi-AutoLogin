name: Build and publish release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  android:
    name: Android release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify tag matches Android version
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${VERSION#v}"
          app_version="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          test -n "$app_version"
          if [ "$tag_version" != "$app_version" ]; then
            echo "Tag version $tag_version does not match Android versionName $app_version" >&2
            exit 1
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Stage Android artifact
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -iname '*.apk' | head -n 1)"
          test -n "$apk"
          mkdir -p ../dist
          cp "$apk" "../dist/GiWiFi-AutoLogin-Android-${version}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiWiFi-AutoLogin-Android-${{ github.ref_name }}
          path: dist/GiWiFi-AutoLogin-Android-*.apk
          if-no-files-found: error

  windows:
    name: Windows portable package
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows/requirements-build.txt

      - name: Cache PyInstaller build cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pyinstaller
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('windows/requirements-build.txt') }}
          restore-keys: |
            ${{ runner.os }}-pyinstaller-

      - name: Install build dependency
        run: python -m pip install -r windows/requirements-build.txt

      - name: Build Windows executable
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --windowed
          --name GiWiFi_AutoLogin
          --distpath build/windows-dist
          --workpath build/windows-work
          --specpath build/windows-spec
          windows/giwifi_gui.py

      - name: Package Windows artifact
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION -replace '^v', ''
          $staging = Join-Path $env:RUNNER_TEMP 'GiWiFi-AutoLogin-Windows'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $staging, $dist | Out-Null
          Copy-Item 'build/windows-dist/GiWiFi_AutoLogin.exe' $staging
          Copy-Item 'windows/使用说明.txt' $staging
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath (Join-Path $dist "GiWiFi-AutoLogin-Windows-x64-$version.zip") -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiWiFi-AutoLogin-Windows-${{ github.ref_name }}
          path: dist/GiWiFi-AutoLogin-Windows-x64-*.zip
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [android, windows]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: GiWiFi-AutoLogin-Android-${{ github.ref_name }}
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: GiWiFi-AutoLogin-Windows-${{ github.ref_name }}
          path: dist

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -print
          test "$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 1

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes_file=".github/release-notes/${version}.md"
          if [ -f "$notes_file" ]; then
            gh release create "$TAG" dist/* --verify-tag --title "GiWiFi-AutoLogin ${TAG}" --notes-file "$notes_file"
          else
            gh release create "$TAG" dist/* --verify-tag --title "GiWiFi-AutoLogin ${TAG}" --generate-notes
          fi
